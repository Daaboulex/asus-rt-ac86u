name: Firmware
on:
  push:
    branches: [main]
    paths:
      - flake.lock
      - openwrt/**
      - .github/workflows/firmware.yml
  workflow_run:
    workflows: [Maintenance]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware
  cancel-in-progress: false

jobs:
  moved:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.main.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: github.event_name == 'workflow_run'
        with:
          ref: main
      - name: Build after Maintenance only when it moved main
        id: main
        env:
          EVENT: ${{ github.event_name }}
          MAINTENANCE_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          build=yes
          if [ "$EVENT" = workflow_run ]; then
            if [ -z "$MAINTENANCE_HEAD" ]; then
              echo "::error::the Maintenance run names no head commit, so whether it moved main cannot be told"
              exit 1
            fi
            head=$(git rev-parse HEAD)
            if [ "$head" = "$MAINTENANCE_HEAD" ]; then
              build=no
            fi
            echo "Maintenance ran on $MAINTENANCE_HEAD and main is at $head"
          fi
          echo "build=$build"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    needs: moved
    if: needs.moved.outputs.build == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3
        with:
          extra-conf: lazy-trees = false

      - name: Reclaim the runner disk the OpenWrt build needs
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          df -h /

      - name: Allow unprivileged user namespaces, which the build environment needs
        run: |
          for knob in kernel.apparmor_restrict_unprivileged_userns kernel.apparmor_restrict_unprivileged_unconfined; do
            f="/proc/sys/${knob//.//}"
            [ -e "$f" ] || continue
            sudo sysctl -w "$knob=0"
          done
          unshare --user --map-root-user true || {
            echo "::error::this runner refuses an unprivileged user namespace, so the OpenWrt build environment cannot start"
            exit 1
          }

      - name: Build the image from the pinned OpenWrt, feeds and patch series
        shell: bash
        timeout-minutes: 330
        run: nix run .#openwrt-build -- rt-ac86u 2>&1 | tee "$RUNNER_TEMP/log-firmware.log"

      - name: Report the disk the build used
        if: always()
        run: df -h /

      - name: Collect the image with its checksums
        run: |
          mkdir "$RUNNER_TEMP/firmware"
          cp .devshell/openwrt/bin/targets/bcm4908/generic/*asus_rt-ac86u*.bin "$RUNNER_TEMP/firmware/"
          cd "$RUNNER_TEMP/firmware"
          sha256sum -- *.bin > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rt-ac86u-firmware
          path: ${{ runner.temp }}/firmware
          if-no-files-found: error

      - name: Keep the build log for the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: log-firmware
          path: ${{ runner.temp }}/log-firmware.log

  report:
    needs: build
    if: always() && (needs.build.result == 'failure' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: "Firmware: image build"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Fetch the standard at the commit flake.lock pins
        if: needs.build.result == 'failure'
        run: |
          set -o pipefail
          repository=$(jq -er '.nodes.std.locked | "\(.owner)/\(.repo)"' flake.lock)
          sha=$(jq -er '.nodes.std.locked.rev' flake.lock)
          mkdir -p "$RUNNER_TEMP/std"
          curl -fsSL --retry 5 --retry-all-errors "https://codeload.github.com/$repository/tar.gz/$sha" |
            tar -xz --strip-components=1 -C "$RUNNER_TEMP/std"
          echo "STD=$RUNNER_TEMP/std" >>"$GITHUB_ENV"
          echo "running the scripts of $repository at $sha"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.build.result == 'failure'
        with:
          pattern: log-*
          path: /tmp/logs
          merge-multiple: true

      - name: Report the failure
        if: needs.build.result == 'failure'
        run: |
          log=/tmp/logs/log-firmware.log
          if [ ! -f "$log" ]; then
            mkdir -p /tmp/logs
            echo "No log reached the report: the run failed before the build wrote one." >"$log"
          fi
          fence='```'
          {
            printf '## Firmware build failed\n\n'
            printf 'The image did not build from the pins on the default branch, so no image was published for them. '
            printf 'The pins have already landed: the lock refresh proves only that the patch series applies to the OpenWrt tree. '
            printf 'The whole build log is the artifact log-firmware of the run.\n'
            printf '\n### Recovery\n\n%sbash\nnix run .#openwrt-build -- rt-ac86u\n%s\n' "$fence" "$fence"
          } >/tmp/issue-head.md
          bash "$STD/report-failure.sh" maintenance "$TITLE" "$TITLE failed" /tmp/issue-head.md "$log"

      - name: Close the firmware issues this clean build resolves
        if: needs.build.result == 'success'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --label maintenance --state open --limit 100 --json number,title \
            --jq ".[] | select(.title | startswith(\"$TITLE\")) | .number")
          for number in $open; do
            gh issue close "$number" --reason completed --comment "Resolved: the image built clean in $RUN_URL."
          done
